- id: api_deisgn-principles
  name: Api Design Principles
  description: Master REST and GraphQL API design principles to build intuitive, scalable, and maintainable
    APIs that delight developers. Use when designing new APIs, reviewing API specifications, or establishing
    API design standards.
  instructions: '# API Design Principles


    Master REST and GraphQL API design principles to build intuitive, scalable, and maintainable APIs
    that delight developers and stand the test of time.


    ## When to Use This Skill


    - Designing new REST or GraphQL APIs

    - Refactoring existing APIs for better usability

    - Establishing API design standards for your team

    - Reviewing API specifications before implementation

    - Migrating between API paradigms (REST to GraphQL, etc.)

    - Creating developer-friendly API documentation

    - Optimizing APIs for specific use cases (mobile, third-party integrations)


    ## Core Concepts


    ### 1. RESTful Design Principles


    **Resource-Oriented Architecture**


    - Resources are nouns (users, orders, products), not verbs

    - Use HTTP methods for actions (GET, POST, PUT, PATCH, DELETE)

    - URLs represent resource hierarchies

    - Consistent naming conventions


    **HTTP Methods Semantics:**


    - `GET`: Retrieve resources (idempotent, safe)

    - `POST`: Create new resources

    - `PUT`: Replace entire resource (idempotent)

    - `PATCH`: Partial resource updates

    - `DELETE`: Remove resources (idempotent)


    ### 2. GraphQL Design Principles


    **Schema-First Development**


    - Types define your domain model

    - Queries for reading data

    - Mutations for modifying data

    - Subscriptions for real-time updates


    **Query Structure:**


    - Clients request exactly what they need

    - Single endpoint, multiple operations

    - Strongly typed schema

    - Introspection built-in


    ### 3. API Versioning Strategies


    **URL Versioning:**


    ```

    /api/v1/users

    /api/v2/users

    ```


    **Header Versioning:**


    ```

    Accept: application/vnd.api+json; version=1

    ```


    **Query Parameter Versioning:**


    ```

    /api/users?version=1

    ```


    ## Detailed patterns and worked examples


    Detailed pattern documentation lives in `references/details.md`. Read that file when the navigation
    tier above is insufficient.


    ## Best Practices


    ### REST APIs


    1. **Consistent Naming**: Use plural nouns for collections (`/users`, not `/user`)

    2. **Stateless**: Each request contains all necessary information

    3. **Use HTTP Status Codes Correctly**: 2xx success, 4xx client errors, 5xx server errors

    4. **Version Your API**: Plan for breaking changes from day one

    5. **Pagination**: Always paginate large collections

    6. **Rate Limiting**: Protect your API with rate limits

    7. **Documentation**: Use OpenAPI/Swagger for interactive docs


    ### GraphQL APIs


    1. **Schema First**: Design schema before writing resolvers

    2. **Avoid N+1**: Use DataLoaders for efficient data fetching

    3. **Input Validation**: Validate at schema and resolver levels

    4. **Error Handling**: Return structured errors in mutation payloads

    5. **Pagination**: Use cursor-based pagination (Relay spec)

    6. **Deprecation**: Use `@deprecated` directive for gradual migration

    7. **Monitoring**: Track query complexity and execution time


    ## Common Pitfalls


    - **Over-fetching/Under-fetching (REST)**: Fixed in GraphQL but requires DataLoaders

    - **Breaking Changes**: Version APIs or use deprecation strategies

    - **Inconsistent Error Formats**: Standardize error responses

    - **Missing Rate Limits**: APIs without limits are vulnerable to abuse

    - **Poor Documentation**: Undocumented APIs frustrate developers

    - **Ignoring HTTP Semantics**: POST for idempotent operations breaks expectations

    - **Tight Coupling**: API structure shouldn''t mirror database schema'
  source_dir: D:/AI Harness skills/skills/api-design-principles
  trigger_command: /api_deisgn-principles
- id: fastpapi-expert
  name: Fastapi Expert
  description: 'Use when building high-performance async Python APIs with FastAPI and Pydantic V2. Invoke
    to create REST endpoints, define Pydantic models, implement authentication flows, set up async SQLAlchemy
    database operations, add JWT authentication, build WebSocket endpoints, or generate OpenAPI documentation.
    Trigger terms: FastAPI, Pydantic, async Python, Python API, REST API Python, SQLAlchemy async, JWT
    authentication, OpenAPI, Swagger Python.'
  instructions: "# FastAPI Expert\n\nDeep expertise in async Python, Pydantic V2, and production-grade\
    \ API development with FastAPI.\n\n## When to Use This Skill\n\n- Building REST APIs with FastAPI\n\
    - Implementing Pydantic V2 validation schemas\n- Setting up async database operations\n- Implementing\
    \ JWT authentication/authorization\n- Creating WebSocket endpoints\n- Optimizing API performance\n\
    \n## Core Workflow\n\n1. **Analyze requirements** — Identify endpoints, data models, auth needs\n\
    2. **Design schemas** — Create Pydantic V2 models for validation\n3. **Implement** — Write async endpoints\
    \ with proper dependency injection\n4. **Secure** — Add authentication, authorization, rate limiting\n\
    5. **Test** — Write async tests with pytest and httpx; run `pytest` after each endpoint group and\
    \ verify OpenAPI docs at `/docs`\n\n> **Checkpoint after each step:** confirm schemas validate correctly,\
    \ endpoints return expected HTTP status codes, and `/docs` reflects the intended API surface before\
    \ proceeding.\n\n## Minimal Complete Example\n\nSchema + endpoint + dependency injection in one cohesive\
    \ unit:\n\n```python\n# schemas.py\nfrom pydantic import BaseModel, EmailStr, field_validator, model_config\n\
    \nclass UserCreate(BaseModel):\n    model_config = model_config(str_strip_whitespace=True)\n\n   \
    \ email: EmailStr\n    password: str\n    name: str | None = None\n\n    @field_validator(\"password\"\
    )\n    @classmethod\n    def password_strength(cls, v: str) -> str:\n        if len(v) < 8:\n    \
    \        raise ValueError(\"Password must be at least 8 characters\")\n        return v\n\nclass UserResponse(BaseModel):\n\
    \    model_config = model_config(from_attributes=True)\n\n    id: int\n    email: EmailStr\n    name:\
    \ str | None = None\n```\n\n```python\n# routers/users.py\nfrom fastapi import APIRouter, Depends,\
    \ HTTPException, status\nfrom sqlalchemy.ext.asyncio import AsyncSession\nfrom typing import Annotated\n\
    \nfrom app.database import get_db\nfrom app.schemas import UserCreate, UserResponse\nfrom app import\
    \ crud\n\nrouter = APIRouter(prefix=\"/users\", tags=[\"users\"])\n\nDbDep = Annotated[AsyncSession,\
    \ Depends(get_db)]\n\n@router.post(\"/\", response_model=UserResponse, status_code=status.HTTP_201_CREATED)\n\
    async def create_user(payload: UserCreate, db: DbDep) -> UserResponse:\n    existing = await crud.get_user_by_email(db,\
    \ payload.email)\n    if existing:\n        raise HTTPException(status_code=status.HTTP_409_CONFLICT,\
    \ detail=\"Email already registered\")\n    return await crud.create_user(db, payload)\n```\n\n```python\n\
    # crud.py\nfrom sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\nfrom app.models\
    \ import User\nfrom app.schemas import UserCreate\nfrom app.security import hash_password\n\nasync\
    \ def get_user_by_email(db: AsyncSession, email: str) -> User | None:\n    result = await db.execute(select(User).where(User.email\
    \ == email))\n    return result.scalar_one_or_none()\n\nasync def create_user(db: AsyncSession, payload:\
    \ UserCreate) -> User:\n    user = User(email=payload.email, hashed_password=hash_password(payload.password),\
    \ name=payload.name)\n    db.add(user)\n    await db.commit()\n    await db.refresh(user)\n    return\
    \ user\n```\n\n## JWT Authentication Snippet\n\n```python\n# security.py\nfrom datetime import datetime,\
    \ timedelta, timezone\nfrom jose import JWTError, jwt\nfrom fastapi import Depends, HTTPException,\
    \ status\nfrom fastapi.security import OAuth2PasswordBearer\nfrom typing import Annotated\n\nSECRET_KEY\
    \ = \"read-from-env\"  # use os.environ / settings\nALGORITHM = \"HS256\"\noauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"\
    /auth/token\")\n\ndef create_access_token(subject: str, expires_delta: timedelta = timedelta(minutes=30))\
    \ -> str:\n    payload = {\"sub\": subject, \"exp\": datetime.now(timezone.utc) + expires_delta}\n\
    \    return jwt.encode(payload, SECRET_KEY, algorithm=ALGORITHM)\n\nasync def get_current_user(token:\
    \ Annotated[str, Depends(oauth2_scheme)]) -> str:\n    try:\n        data = jwt.decode(token, SECRET_KEY,\
    \ algorithms=[ALGORITHM])\n        subject: str | None = data.get(\"sub\")\n        if subject is\
    \ None:\n            raise ValueError\n        return subject\n    except (JWTError, ValueError):\n\
    \        raise HTTPException(status_code=status.HTTP_401_UNAUTHORIZED, detail=\"Invalid credentials\"\
    )\n\nCurrentUser = Annotated[str, Depends(get_current_user)]\n```\n\n## Reference Guide\n\nLoad detailed\
    \ guidance based on context:\n\n| Topic | Reference | Load When |\n|-------|-----------|-----------|\n\
    | Pydantic V2 | `references/pydantic-v2.md` | Creating schemas, validation, model_config |\n| SQLAlchemy\
    \ | `references/async-sqlalchemy.md` | Async database, models, CRUD operations |\n| Endpoints | `references/endpoints-routing.md`\
    \ | APIRouter, dependencies, routing |\n| Authentication | `references/authentication.md` | JWT, OAuth2,\
    \ get_current_user |\n| Testing | `references/testing-async.md` | pytest-asyncio, httpx, fixtures\
    \ |\n| Django Migration | `references/migration-from-django.md` | Migrating from Django/DRF to FastAPI\
    \ |\n\n## Constraints\n\n### MUST DO\n- Use type hints everywhere (FastAPI requires them)\n- Use Pydantic\
    \ V2 syntax (`field_validator`, `model_validator`, `model_config`)\n- Use `Annotated` pattern for\
    \ dependency injection\n- Use async/await for all I/O operations\n- Use `X | None` instead of `Optional[X]`\n\
    - Return proper HTTP status codes\n- Document endpoints (auto-generated OpenAPI)\n\n### MUST NOT DO\n\
    - Use synchronous database operations\n- Skip Pydantic validation\n- Store passwords in plain text\n\
    - Expose sensitive data in responses\n- Use Pydantic V1 syntax (`@validator`, `class Config`)\n- Mix\
    \ sync and async code improperly\n- Hardcode configuration values\n\n## Output Templates\n\nWhen implementing\
    \ FastAPI features, provide:\n1. Schema file (Pydantic models)\n2. Endpoint file (router with endpoints)\n\
    3. CRUD operations if database involved\n4. Brief explanation of key decisions\n\n## Knowledge Reference\n\
    \nFastAPI, Pydantic V2, async SQLAlchemy, Alembic migrations, JWT/OAuth2, pytest-asyncio, httpx, BackgroundTasks,\
    \ WebSockets, dependency injection, OpenAPI/Swagger\n\n[Documentation](https://jeffallan.github.io/claude-skil"
  source_dir: D:/AI Harness skills/skills/fastapi-expert
  trigger_command: /fastpapi-expert
- id: front-end-design
  name: Frontend Design
  description: Guidance for distinctive, intentional visual design when building new UI or reshaping an
    existing one. Helps with aesthetic direction, typography, and making choices that don't read as templated
    defaults.
  instructions: '# Frontend Design


    Approach this as the design lead at a small studio known for giving every client a visual identity
    that could not be mistaken for anyone else''s. This client has already rejected proposals that felt
    templated, and is paying for a distinctive point of view: make deliberate, opinionated choices about
    palette, typography, and layout that are specific to this brief, and take one real aesthetic risk
    you can justify.


    ## Ground it in the subject


    If the brief does not pin down what the product or subject is, pin it yourself before designing: name
    one concrete subject, its audience, and the page''s single job, and state your choice. If there''s
    any information in your memory about the human''s preferences, context about what they''re building,
    or designs you''ve made before – use that as a hint. The subject''s own world, its materials, instruments,
    artifacts, and vernacular, is where distinctive choices come from. Build with the brief''s real content
    and subject matter throughout.


    ## Design principles


    For web designs, the hero is a thesis. Open with the most characteristic thing in the subject''s world,
    in whatever form makes sense for it: a headline, an image, an animation, a live demo, an interactive
    moment. Be deliberate with your choice: a big number with a small label, supporting stats, and a gradient
    accent is the template answer, only use if that''s truly the best option.


    Typography carries the personality of the page. Pair the display and body faces deliberately, not
    the same families you would reach for on any other project, and set a clear type scale with intentional
    weights, widths, and spacing. Make the type treatment itself a memorable part of the design, not a
    neutral delivery vehicle for the content.


    Structure is information. Structural devices, numbering, eyebrows, dividers, labels, should encode
    something true about the content, not decorate it. Many generic designs use numbered markers (01 /
    02 / 03), but that''s only appropriate if the content actually is a sequence - like a real process
    or a typed timeline where order carries information the reader needs. Question if choices like numbered
    markers actually make sense before incorporating them.


    Leverage motion deliberately. Think about where and if animation can serve the subject: a page-load
    sequence, a scroll-triggered reveal, hover micro-interactions, ambient atmosphere. An orchestrated
    moment usually lands harder than scattered effects; choose what the direction calls for. However,
    sometimes less is more, and extra animation contributes to the feeling that the design is AI-generated.


    Match complexity to the vision. Maximalist directions need elaborate execution; minimal directions
    need precision in spacing, type, and detail. Elegance is executing the chosen vision well.


    Consider written content carefully. Often a design brief may not contain real content, and it''s up
    to you to come up with copy. Copy can make a design feel as templated as the design itself. See the
    below section on writing for more guidance.


    ## Process: brainstorm, explore, plan, critique, build, critique again


    For calibration: AI-generated design right now clusters around three looks: (1) a warm cream background
    (near #F4F1EA) with a high-contrast serif display and a terracotta accent; (2) a near-black background
    with a single bright acid-green or vermilion accent; (3) a broadsheet-style layout with hairline rules,
    zero border-radius, and dense newspaper-like columns. All three are legitimate for some briefs, but
    they are defaults rather than choices, and they appear regardless of subject. Where the brief pins
    down a visual direction, follow it exactly — the brief''s own words always win, including when it
    asks for one of these looks. Where it leaves an axis free, don''t spend that freedom on one of these
    defaults. Just like a human designer who''s hired, there''s often a careful balance between doing
    what you''re good at and taking each project as a chance to experiment and learn.


    Work in two passes. First, brainstorm a short design plan based on the human''s design brief: create
    a compact token system with color, type, layout, and signature. Color: describe the palette as 4–6
    named hex values. Type: the typefaces for 2+ roles (a characterful display face that''s used with
    restraint, a complementary body face, and a utility face for captions or data if needed). Layout:
    a layout concept, using one-sentence prose descriptions and ASCII wireframes to ideate and compare.
    Signature: the single unique element this page will be remembered by that embodies the brief in an
    appropriate way.


    Then review that plan against the brief before building: if any part of it reads like the generic
    default you would produce for any similar page (work through a similar prompt to see if you arrive
    somewhere similar) rather than a choice made for this specific brief — revise that part, say what
    you changed and why. Only after you''ve confirmed the relative uniqueness of your design plan should
    you start to write the code, following the revised plan exactly and deriving every color and type
    decision from it.


    When writing the code, be careful of structuring your CSS selector specificities. It''s easy to generate
    CSS classes that cancel each other out (especially with a type-based selector like .section and a
    element-based selector like .cta). This can happen often with paddings/margins between sections.


    Try to do a lot of this planning and iteration in your thinking, and only show ideas to the user when
    you have higher confidence it''ll delight them.


    ## Restraint and self-critique


    Spend your boldness in one place. Let the signature element be the one memorable thing, keep everything
    around it quiet and disciplined, and cut any decoration that does not serve the brief. Not taking
    a risk can be a risk itself! Build to a quality floor without announcing it: responsive down to mobile,
    visible keyboard focus, reduced motion respected. Critique your own work as you build, t'
